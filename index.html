<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CodeCards V3</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
📚 CodeCards V3
</h1>


<nav>

<button>
Lernen
</button>

<button>
Karten
</button>

<button>
Statistik
</button>

</nav>


</header>



<main>


<section class="card">


<div id="category">
Kategorie
</div>



<h2 id="question">
Frage wird geladen...
</h2>



<div id="answer" style="display:none;">

Antwort

</div>



<button id="showAnswer">

Antwort anzeigen

</button>



<div id="rating" style="display:none;">


<button data-rating="wrong">
❌
</button>


<button data-rating="hard">
😕
</button>


<button data-rating="good">
🙂
</button>


<button data-rating="easy">
🚀
</button>


</div>


</section>


</main>



<script src="js/app.js"></script>


</body>

</html>
